<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sahyadri Tourism</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <nav>
        <img src="./Sassets/sahyadri.png" alt="Logo" class="mini-logo">
        <a href="index.html">Home</a>
        <a href="index.html#destinations">Destinations</a>
        <a href="packages.html">Packages</a>
        <a href="gallery.html">Gallery</a>
        <a href="login.html" class="active">Login</a>
        <a href="contact.html">Contact</a>
        <a href="index.html#about-us">About Us</a>
    </nav>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>User Login</h2>
            <form action="#">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter your username" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="signup.html">Create New User</a></p>
                <p><a href="#">Forgot Password?</a></p>
            </div>
        </div>
    </div>
    <footer class="mini-footer">
        <p>&copy; 2026 Sahyadri Tourism. All Rights Reserved.</p>
    </footer>

</body>
</html>
