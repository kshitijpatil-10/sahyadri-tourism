<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Sahyadri Tourism</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <nav>
        <img src="./Sassets/sahyadri.png" alt="Logo" class="mini-logo">
        <a href="index.html">Home</a>
        <a href="index.html#destinations">Destinations</a>
        <a href="packages.html">Packages</a>
        <a href="gallery.html">Gallery</a>
        <a href="login.html">Login</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="index.html#about-us">About Us</a>
    </nav>

    <div class="contact-wrapper">
        <div class="contact-container">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <p>Have questions about our treks or packages? Reach out to us!</p>
                
                <div class="info-item">
                    <span>📍</span>
                    <p>Sahyadri Bhawan, Pune, Maharashtra</p>
                </div>
                <div class="info-item">
                    <span>📞</span>
                    <p>+91 98765 43210</p>
                </div>
                <div class="info-item">
                    <span>✉️</span>
                    <p>info@sahyadritourism.com</p>
                </div>
            </div>

            <div class="contact-form">
                <form action="#">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="input-group">
                        <label>Message</label>
                        <textarea rows="5" placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="submit" class="contact-btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>
    <footer class="mini-footer">
        <p>&copy; 2026 Sahyadri Tourism. All Rights Reserved.</p>
    </footer>

</body>
</html>
