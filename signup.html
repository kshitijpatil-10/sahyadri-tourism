<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Sahyadri Tourism</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css"> </head>
<body>

    <nav>
        <img src="./Sassets/sahyadri.png" alt="Logo" class="mini-logo">
        <a href="index.html">Home</a>
        <a href="index.html#destinations">Destinations</a>
        <a href="packages.html">Packages</a>
        <a href="gallery.html">Gallery</a>
        <a href="login.html">Login</a>
        <a href="contact.html">Contact</a>
        <a href="index.html#about-us">About Us</a>
    </nav>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>Create Account</h2>
            <form action="#">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label>Create Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="login-btn">Register Now</button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>
    <footer class="mini-footer">
        <p>&copy; 2026 Sahyadri Tourism. All Rights Reserved.</p>
    </footer>

</body>
</html>
